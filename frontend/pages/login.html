<!DOCTYPE html>
<html lang="es">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanBot - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan:   #5EEAD4;
            --cyan2:  #3FA796;
            --purple: #8B5CF6;
            --rose:   #6D5BD0;
            --green:  #10B981;
            --red:    #f87171;
            --muted:  #6b7280;
            --second: #9ca3af;
            --bg:     #0B0B22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse at 30% 0%, #35356B 0%, #11112B 45%, var(--bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── FONDO ─────────────────────────────────────── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 15% 25%, rgba(94,234,212,0.07) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(139,92,246,0.07) 0%, transparent 45%);
        }
        /* Grid punteado sutil */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(rgba(94,234,212,0.05) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Orbe animado */
        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
            animation: orbDrift 16s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; top: -200px; right: -160px; background: radial-gradient(circle, rgba(94,234,212,0.12) 0%, transparent 70%); animation-delay: 0s; }
        .orb-2 { width: 380px; height: 380px; bottom: -140px; left: -120px; background: radial-gradient(circle, rgba(139,92,246,0.10) 0%, transparent 70%); animation-delay: -7s; }
        @keyframes orbDrift {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(20px,-30px); }
        }

        /* ── CARD ───────────────────────────────────────── */
        .card-login {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            background: rgba(var(--fb-fg),0.035);
            border: 1px solid rgba(94,234,212,0.22);
            border-radius: 26px;
            padding: 44px 38px 38px;
            backdrop-filter: blur(24px);
            box-shadow: 0 28px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(94,234,212,0.06);
        }
        .google-signin { display:flex; justify-content:center; min-height:40px; margin:0 0 18px; }
        .google-status { color:var(--muted); font-size:12px; text-align:center; margin:-8px 0 14px; }
        /* Línea superior degradada */
        .card-login::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #5EEAD4, #8B5CF6, #6D5BD0, transparent);
            border-radius: 26px 26px 0 0;
        }

        /* ── LOGO ───────────────────────────────────────── */
        .logo-wrap {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 26px;
        }
        .logo-img {
            width: 70px; height: 70px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(94,234,212,0.3);
            box-shadow: 0 0 24px rgba(94,234,212,0.35), 0 0 48px rgba(94,234,212,0.12);
            margin-bottom: 14px;
        }
        .logo-fallback {
            width: 70px; height: 70px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(63,167,150,0.3), rgba(139,92,246,0.25));
            border: 2px solid rgba(94,234,212,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 14px;
            box-shadow: 0 0 24px rgba(94,234,212,0.3);
        }
        .titulo {
            font-family: 'Segoe UI', sans-serif; font-size: 26px; font-weight: 800;
            background: linear-gradient(90deg, #5EEAD4, #8B5CF6, #6D5BD0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px; text-align: center; letter-spacing: -0.3px;
        }
        .subtitulo { text-align: center; color: var(--fb-cyan-soft); font-size: 13px; }

        /* ── ALERTAS ────────────────────────────────────── */
        .alerta {
            padding: 12px 16px; border-radius: 12px; margin-bottom: 20px;
            font-size: 13px; display: none; align-items: center; gap: 9px;
        }
        .alerta.visible { display: flex; animation: slideDown .3s ease; }
        @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        .alerta-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--fb-red-soft); }
        .alerta-exito { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--fb-green-soft); }

        /* ── CAMPOS ─────────────────────────────────────── */
        .campo { margin-bottom: 18px; }
        .campo-label {
            display: block; font-size: 11px; font-weight: 700;
            color: var(--fb-cyan-soft); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px;
        }
        .campo-row { display: flex; }
        .campo-prefix {
            width: 44px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(94,234,212,0.09); border: 1.5px solid rgba(94,234,212,0.25);
            border-right: none; border-radius: 12px 0 0 12px; color: var(--cyan); font-size: 13px;
        }
        .campo-input {
            flex: 1; background: rgba(var(--fb-fg),0.04);
            border: 1.5px solid rgba(94,234,212,0.22); border-left: none;
            border-radius: 0 12px 12px 0;
            color: var(--fb-text); padding: 12px 15px; font-size: 14px; outline: none;
            transition: all .3s; font-family: 'Segoe UI', sans-serif;
        }
        .campo-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(94,234,212,0.12); background: rgba(94,234,212,0.04); }
        .campo-input::placeholder { color: var(--muted); }
        .campo-input.con-ojo { border-radius: 0; }

        .ojo-btn {
            background: rgba(94,234,212,0.09); border: 1.5px solid rgba(94,234,212,0.22);
            border-left: none; border-radius: 0 12px 12px 0;
            color: var(--muted); padding: 0 14px; cursor: pointer; transition: all .3s;
            display: flex; align-items: center; font-size: 14px;
        }
        .ojo-btn:hover { color: var(--cyan); background: rgba(94,234,212,0.15); }

        /* ── OLVIDÉ CONTRASEÑA ─────────────────────────── */
        .link-olvide {
            display: block; text-align: left; font-size: 12px; color: var(--cyan);
            text-decoration: none; margin-top: -10px; margin-bottom: 20px;
            transition: color .3s; font-weight: 600;
        }
        .link-olvide:hover { color: var(--fb-cyan-soft); }

        /* ── BOTÓN INGRESAR ─────────────────────────────── */
        .btn-login {
            width: 100%; border: none; border-radius: 12px; padding: 14px;
            font-size: 15px; font-weight: 700; color: var(--fb-text); cursor: pointer;
            background: linear-gradient(135deg, #3FA796, #5EEAD4);
            box-shadow: 0 6px 24px rgba(94,234,212,0.32);
            transition: all .3s; display: flex; align-items: center; justify-content: center;
            gap: 9px; font-family: 'Segoe UI', sans-serif; margin-bottom: 20px;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(94,234,212,0.52); }
        .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(var(--fb-fg),0.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── LINKS INFERIORES ───────────────────────────── */
        .sep { height: 1px; background: rgba(var(--fb-fg),0.07); margin-bottom: 18px; }
        .link-registro { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
        .link-registro a { color: var(--purple); text-decoration: none; font-weight: 600; transition: color .3s; }
        .link-registro a:hover { color: #A78BFA; }
        .link-invitado { text-align: center; }
        .link-invitado a { color: #374151; font-size: 12px; text-decoration: none; transition: color .3s; }
        .link-invitado a:hover { color: var(--second); }

        /* ══════════════════════════════════════════════════
           MODAL OLVIDÉ CONTRASEÑA
        ══════════════════════════════════════════════════ */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.visible { display: flex; }

        .modal-box {
            background: linear-gradient(145deg, #1A1A3D, #11112B);
            border: 1px solid rgba(139,92,246,0.28);
            border-radius: 24px; padding: 36px 32px; width: 100%; max-width: 430px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(139,92,246,0.1);
            animation: modalIn .35s cubic-bezier(0.34,1.56,0.64,1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn { from{opacity:0;transform:scale(0.9) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .modal-box::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #6D5BD0, #8B5CF6, #5EEAD4, transparent);
            border-radius: 24px 24px 0 0;
        }

        .modal-close {
            position: absolute; top: 16px; right: 18px;
            background: rgba(var(--fb-fg),0.06); border: 1px solid rgba(var(--fb-fg),0.1);
            color: var(--second); width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; transition: all .3s;
        }
        .modal-close:hover { background: rgba(239,68,68,0.18); color: #ef4444; }

        /* Stepper del modal */
        .modal-stepper { display: flex; align-items: center; gap: 0; margin-bottom: 28px; }
        .ms-item { display: flex; align-items: center; gap: 0; flex: 1; }
        .ms-item:last-child { flex: none; }
        .ms-circle {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; transition: all .4s;
            border: 2px solid rgba(139,92,246,0.2); color: var(--muted);
            font-family: 'Space Mono', monospace;
        }
        .ms-circle.activo { border-color: var(--purple); color: var(--fb-text); background: rgba(139,92,246,0.15); box-shadow: 0 0 12px rgba(139,92,246,0.4); }
        .ms-circle.hecho  { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.1); }
        .ms-line { flex: 1; height: 1px; background: rgba(139,92,246,0.15); transition: background .4s; margin: 0 4px; }
        .ms-line.activa { background: linear-gradient(90deg, var(--green), var(--purple)); }

        .modal-titulo { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; color: var(--fb-text); margin-bottom: 4px; letter-spacing: -0.3px; }
        .modal-sub { font-size: 13px; color: var(--second); margin-bottom: 22px; }

        /* Alertas modal */
        .alerta-modal {
            padding: 11px 14px; border-radius: 11px; font-size: 13px; margin-bottom: 16px;
            display: none; align-items: center; gap: 8px;
        }
        .alerta-modal.visible { display: flex; }
        .alerta-modal-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--fb-red-soft); }
        .alerta-modal-exito { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--fb-green-soft); }

        /* Campos modal */
        .m-campo { margin-bottom: 16px; }
        .m-label { display: block; font-size: 11px; font-weight: 700; color: var(--fb-lav); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 7px; }
        .m-input {
            width: 100%; background: rgba(var(--fb-fg),0.04);
            border: 1.5px solid rgba(139,92,246,0.22); border-radius: 12px;
            color: var(--fb-text); padding: 12px 15px; font-size: 14px; outline: none;
            transition: all .3s; font-family: 'Segoe UI', sans-serif;
        }
        .m-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); background: rgba(139,92,246,0.05); }
        .m-input::placeholder { color: var(--muted); }
        .m-input-row { display: flex; }
        .m-input-row .m-input { border-radius: 12px 0 0 12px; border-right: none; flex: 1; }
        .m-ojo {
            background: rgba(139,92,246,0.08); border: 1.5px solid rgba(139,92,246,0.22);
            border-left: none; border-radius: 0 12px 12px 0;
            color: var(--muted); padding: 0 13px; cursor: pointer; transition: all .3s;
            display: flex; align-items: center; font-size: 13px;
        }
        .m-ojo:hover { color: var(--purple); }

        /* Pregunta box */
        .pregunta-box {
            background: rgba(139,92,246,0.07); border: 1px solid rgba(139,92,246,0.2);
            border-radius: 12px; padding: 14px 16px; font-size: 14px;
            color: var(--fb-lav); margin-bottom: 18px; line-height: 1.5;
        }

        /* reCAPTCHA container */
        .recaptcha-wrap {
            margin-bottom: 18px;
            display: flex; justify-content: center;
            overflow-x: auto;
        }
        /* Estilizar el iframe de reCAPTCHA */
        .recaptcha-wrap .g-recaptcha > div {
            border-radius: 12px; overflow: hidden;
        }

        /* Botón modal */
        .btn-modal {
            width: 100%; border: none; border-radius: 12px; padding: 13px;
            font-size: 14px; font-weight: 700; color: var(--fb-text); cursor: pointer;
            background: linear-gradient(135deg, #6D5BD0, #8B5CF6);
            box-shadow: 0 5px 20px rgba(109,91,208,0.3);
            transition: all .3s; display: flex; align-items: center; justify-content: center;
            gap: 8px; font-family: 'Segoe UI', sans-serif;
        }
        .btn-modal:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(109,91,208,0.5); }
        .btn-modal:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        /* Hint match contraseñas */
        .match-hint { font-size: 11px; margin-top: 6px; display: none; align-items: center; gap: 5px; }

        /* ===================== RESPONSIVE / MOBILE ===================== */
        @media (max-width: 480px) {
            body { padding: 16px 12px; align-items: flex-start; padding-top: 40px; }

            .orb-1, .orb-2 { filter: blur(60px); }

            .card-login {
                padding: 32px 22px 26px;
                border-radius: 20px;
            }

            .logo-img, .logo-fallback { width: 60px; height: 60px; }
            .titulo { font-size: 21px; }
            .subtitulo { font-size: 12px; }

            .campo-label { font-size: 10.5px; }
            .campo-input, .m-input { font-size: 15px; padding: 11px 13px; } /* 15px+ evita zoom automático en iOS */
            .campo-prefix { width: 40px; }

            .btn-login, .btn-modal { font-size: 14px; padding: 13px; }

            .modal-box {
                padding: 26px 18px 22px;
                border-radius: 18px;
            }
            .modal-titulo { font-size: 17px; }
            .modal-sub { font-size: 12px; margin-bottom: 18px; }

            .ms-circle { width: 24px; height: 24px; font-size: 10px; }
            .modal-stepper { margin-bottom: 22px; }

            .pregunta-box { font-size: 13px; padding: 12px 14px; }

            /* Escalar el widget de reCAPTCHA (304px fijo) para que quepa en pantallas angostas */
            .recaptcha-wrap {
                transform: scale(0.87);
                transform-origin: center;
                margin-bottom: 6px;
            }
        }

        @media (max-width: 340px) {
            .recaptcha-wrap { transform: scale(0.77); }
        }
    </style>
    <link rel="stylesheet" href="temas.css">
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- ════════════════════════════════════════════
         MODAL — OLVIDÉ MI CONTRASEÑA
    ════════════════════════════════════════════ -->
    <div class="modal-overlay" id="modalOlvide">
        <div class="modal-box">
            <button class="modal-close" onclick="cerrarModal()">✕</button>

            <div class="modal-titulo">🔑 Recuperar contraseña</div>
            <div class="modal-sub">Elige cómo quieres verificar tu cuenta. Para la pregunta de seguridad no necesitas acceder al correo.</div>

            <!-- Stepper -->
            <div class="modal-stepper">
                <div class="ms-item">
                    <div class="ms-circle activo" id="ms1">1</div>
                    <div class="ms-line" id="ml1"></div>
                </div>
                <div class="ms-item">
                    <div class="ms-circle" id="ms2">2</div>
                </div>
            </div>

            <!-- Alertas -->
            <div class="alerta-modal alerta-modal-error" id="alertaResetError"><i class="fas fa-circle-exclamation"></i><span id="txtResetError"></span></div>
            <div class="alerta-modal alerta-modal-exito" id="alertaResetExito"><i class="fas fa-circle-check"></i><span id="txtResetExito"></span></div>

            <!-- PASO 1: seleccionar método -->
            <div id="paso1Reset">
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-envelope" style="color:var(--purple);margin-right:5px"></i>Correo registrado en tu cuenta</label>
                    <input type="email" class="m-input" id="resetCorreo" placeholder="tu@correo.com">
                </div>
                <button class="btn-modal" onclick="buscarCuenta()">
                    <i class="fas fa-paper-plane"></i> Enviar código
                </button>
                <button class="btn-modal" style="margin-top:10px" onclick="buscarPreguntaSeguridad()">
                    <i class="fas fa-shield-alt"></i> Recuperar con pregunta de seguridad
                </button>
            </div>

            <!-- PASO 2: código y nueva contraseña -->
            <div id="paso2Reset" style="display:none">
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-key" style="color:var(--purple);margin-right:5px"></i>Código recibido por correo</label>
                    <input type="text" class="m-input" id="resetCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Código de 6 dígitos">
                </div>
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-lock" style="color:var(--purple);margin-right:5px"></i>Nueva contraseña</label>
                    <input type="password" class="m-input" id="resetContrasena" placeholder="Mínimo 6 caracteres" oninput="verificarMatchReset()">
                </div>
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-lock" style="color:var(--purple);margin-right:5px"></i>Confirmar contraseña</label>
                    <input type="password" class="m-input" id="resetConfirmar" placeholder="Repite tu contraseña" oninput="verificarMatchReset()">
                    <div class="match-hint" id="matchReset"></div>
                </div>
                <button class="btn-modal" onclick="resetearContrasena()">
                    <i class="fas fa-key"></i> Cambiar contraseña
                </button>
                <button class="btn-modal" id="btnReenviarCodigo" style="margin-top:10px" onclick="reenviarCodigo()" disabled>
                    Reenviar código (60 s)
                </button>
            </div>

            <!-- PASO 2 ALTERNATIVO: pregunta y nueva contraseña -->
            <div id="pasoPreguntaReset" style="display:none">
                <div class="pregunta-box" id="textoPreguntaSeguridad"></div>
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-key" style="color:var(--purple);margin-right:5px"></i>Tu respuesta</label>
                    <input type="text" class="m-input" id="resetRespuestaSeguridad" autocomplete="off">
                </div>
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-lock" style="color:var(--purple);margin-right:5px"></i>Nueva contraseña</label>
                    <input type="password" class="m-input" id="resetContrasenaPregunta" placeholder="Mínimo 6 caracteres" oninput="verificarMatchPregunta()">
                </div>
                <div class="m-campo">
                    <label class="m-label"><i class="fas fa-lock" style="color:var(--purple);margin-right:5px"></i>Confirmar contraseña</label>
                    <input type="password" class="m-input" id="resetConfirmarPregunta" placeholder="Repite tu contraseña" oninput="verificarMatchPregunta()">
                    <div class="match-hint" id="matchPregunta"></div>
                </div>
                <button class="btn-modal" onclick="resetearConPregunta()">
                    <i class="fas fa-key"></i> Cambiar contraseña
                </button>
            </div>

        </div>
    </div>

    <!-- ════════════════════════════════════════════
         CARD LOGIN
    ════════════════════════════════════════════ -->
    <div class="card-login">

        <!-- Logo -->
        <div class="logo-wrap">
            <img src="../../images/logo.png" alt="FinanBot" class="logo-img"
                 onerror="this.outerHTML='<div class=\'logo-fallback\'>🤖</div>'">
            <div class="titulo">Bienvenido de nuevo</div>
            <div class="subtitulo">Ingresa a tu cuenta de FinanBot</div>
        </div>

        <!-- Alertas -->
        <div class="alerta alerta-error" id="alertaError"><i class="fas fa-circle-exclamation"></i><span id="mensajeError"></span></div>
        <div class="alerta alerta-exito" id="alertaExito"><i class="fas fa-circle-check"></i><span id="mensajeExito"></span></div>
        <!-- Correo -->
        <div class="campo">
            <label class="campo-label">Correo electrónico</label>
            <div class="campo-row">
                <div class="campo-prefix"><i class="fas fa-envelope"></i></div>
                <input type="email" id="correo" class="campo-input" placeholder="tu@correo.com"
                       onkeydown="if(event.key==='Enter') login()">
            </div>
        </div>

        <!-- Contraseña -->
        <div class="campo">
            <label class="campo-label">Contraseña</label>
            <div class="campo-row">
                <div class="campo-prefix"><i class="fas fa-lock"></i></div>
                <input type="password" id="contrasena" class="campo-input con-ojo" placeholder="Tu contraseña"
                       onkeydown="if(event.key==='Enter') login()">
                <button class="ojo-btn" type="button" onclick="togglePwd('contrasena',this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <!-- Olvidé contraseña -->
        <a href="#" class="link-olvide" onclick="abrirModal(); return false;">
            ¿Olvidaste tu contraseña?
        </a>

        <div class="google-signin" id="googleButton"></div>
        <p class="google-status" id="googleStatus"></p>

        <!-- Botón ingresar -->
        <button class="btn-login" id="btnLogin" onclick="login()">
            <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>

        <div class="sep"></div>

        <div class="link-registro">
            ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
        </div>
        <div class="link-invitado" style="margin-top:10px">
            <a href="chat.html?invitado=true">
                <i class="fas fa-robot" style="margin-right:4px"></i> Continuar sin registrarse
            </a>
        </div>
    </div>

    <script>
        // ── TOGGLE OJO ────────────────────────────────
        function togglePwd(id, btn) {
            const inp = document.getElementById(id);
            const ico = btn.querySelector('i');
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            ico.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            btn.style.color = show ? 'var(--cyan)' : '';
        }

        // ── ALERTAS LOGIN ─────────────────────────────
        function mostrarError(msg) {
            document.getElementById('mensajeError').textContent = msg;
            document.getElementById('alertaError').classList.add('visible');
            document.getElementById('alertaExito').classList.remove('visible');
        }
        function mostrarExito(msg) {
            document.getElementById('mensajeExito').textContent = msg;
            document.getElementById('alertaExito').classList.add('visible');
            document.getElementById('alertaError').classList.remove('visible');
        }

        // ── LOGIN ─────────────────────────────────────
        async function login() {
            const correo    = document.getElementById('correo').value.trim();
            const contrasena= document.getElementById('contrasena').value;
            const btn       = document.getElementById('btnLogin');

            document.getElementById('alertaError').classList.remove('visible');
            document.getElementById('alertaExito').classList.remove('visible');

            if (!correo || !contrasena) { mostrarError('Correo y contraseña son obligatorios.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Ingresando...';

            try {
                const res  = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token',   data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    mostrarExito(data.aviso_seguridad || ('¡Bienvenido ' + data.usuario.nombre + '! Redirigiendo...'));

                    setTimeout(async () => {
                        try {
                            const rp = await fetch('/api/perfil/', {
    headers: { 'Authorization': 'Bearer ' + data.token }
});
                            const perfil = await rp.json();
                            window.top.location.href = perfil.onboarding_completado ? 'dashboard.html' : 'onboarding.html';
                        } catch {
                            window.top.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    mostrarError(data.detail || data.mensaje || 'Correo o contraseña incorrectos.');
                }
            } catch {
    mostrarError('No se pudo conectar con el servidor. Verifica que esté en ejecución.');
}

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';
        }

        // ══════════════════════════════════════════════
        //  MODAL OLVIDÉ MI CONTRASEÑA
        // ══════════════════════════════════════════════
        let timerReenvio = null;

        function abrirModal() {
            document.getElementById('modalOlvide').classList.add('visible');
        }

        function cerrarModal() {
            if (timerReenvio) clearInterval(timerReenvio);
            timerReenvio = null;
            document.getElementById('modalOlvide').classList.remove('visible');
            document.getElementById('paso1Reset').style.display = 'block';
            document.getElementById('paso2Reset').style.display = 'none';
            document.getElementById('pasoPreguntaReset').style.display = 'none';
            ['resetCorreo','resetCodigo','resetContrasena','resetConfirmar','resetRespuestaSeguridad','resetContrasenaPregunta','resetConfirmarPregunta'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            document.getElementById('textoPreguntaSeguridad').textContent = '';
            document.getElementById('alertaResetError').classList.remove('visible');
            document.getElementById('alertaResetExito').classList.remove('visible');
            actualizarStepper(1);
        }

        function iniciarTemporizadorReenvio() {
            if (timerReenvio) clearInterval(timerReenvio);
            const boton = document.getElementById('btnReenviarCodigo');
            let segundos = 65;
            boton.disabled = true;
            boton.textContent = 'Reenviar código (' + segundos + ' s)';
            timerReenvio = setInterval(() => {
                segundos -= 1;
                if (segundos <= 0) {
                    clearInterval(timerReenvio);
                    timerReenvio = null;
                    boton.disabled = false;
                    boton.innerHTML = '<i class="fas fa-redo"></i> Reenviar código';
                    return;
                }
                boton.textContent = 'Reenviar código (' + segundos + ' s)';
            }, 1000);
        }

        function actualizarStepper(paso) {
            for (let i = 1; i <= 2; i++) {
                const c = document.getElementById('ms' + i);
                c.classList.remove('activo', 'hecho');
                if (i < paso)       { c.classList.add('hecho'); c.innerHTML = '<i class="fas fa-check" style="font-size:10px"></i>'; }
                else if (i === paso) { c.classList.add('activo'); c.textContent = i; }
                else                 { c.textContent = i; }
            }
            document.getElementById('ml1').classList.toggle('activa', paso > 1);
        }

        function mostrarErrorModal(msg) {
            document.getElementById('txtResetError').textContent = msg;
            document.getElementById('alertaResetError').classList.add('visible');
            document.getElementById('alertaResetExito').classList.remove('visible');
        }
        function mostrarExitoModal(msg) {
            document.getElementById('txtResetExito').textContent = msg;
            document.getElementById('alertaResetExito').classList.add('visible');
            document.getElementById('alertaResetError').classList.remove('visible');
        }

        // PASO 1: enviar el código de recuperación al correo
        async function buscarCuenta() {
            const correo = document.getElementById('resetCorreo').value.trim();
            document.getElementById('alertaResetError').classList.remove('visible');

            if (!correo) { mostrarErrorModal('Ingresa tu correo electrónico.'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { mostrarErrorModal('Ingresa un correo válido.'); return; }

            try {
                const res  = await fetch('/api/auth/solicitar-recuperacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarExitoModal(data.mensaje || 'Si existe una cuenta, enviaremos un código a tu correo.');
                    document.getElementById('paso1Reset').style.display = 'none';
                    document.getElementById('paso2Reset').style.display = 'block';
                    actualizarStepper(2);
                    iniciarTemporizadorReenvio();
                } else {
                    mostrarErrorModal(data.detail || 'No se pudo enviar el código.');
                }
            } catch {
                mostrarErrorModal('No se pudo conectar con el servidor.');
            }
        }

        async function reenviarCodigo() {
            const correo = document.getElementById('resetCorreo').value.trim();
            const boton = document.getElementById('btnReenviarCodigo');
            document.getElementById('alertaResetError').classList.remove('visible');
            boton.disabled = true;

            try {
                const res = await fetch('/api/auth/reenviar-codigo-recuperacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo })
                });
                const data = await res.json();
                if (res.ok) {
                    mostrarExitoModal(data.mensaje || 'Si existe una cuenta, enviaremos un nuevo código.');
                    iniciarTemporizadorReenvio();
                } else {
                    mostrarErrorModal(data.detail || 'No se pudo reenviar el código.');
                    boton.disabled = false;
                }
            } catch {
                mostrarErrorModal('No se pudo conectar con el servidor.');
                boton.disabled = false;
            }
        }

        async function buscarPreguntaSeguridad() {
            const correo = document.getElementById('resetCorreo').value.trim();
            document.getElementById('alertaResetError').classList.remove('visible');

            if (!correo) { mostrarErrorModal('Ingresa el correo registrado en tu cuenta.'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { mostrarErrorModal('Ingresa un correo válido.'); return; }

            try {
                const res = await fetch('/api/auth/pregunta-seguridad', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('textoPreguntaSeguridad').textContent = data.pregunta_seguridad;
                    document.getElementById('paso1Reset').style.display = 'none';
                    document.getElementById('pasoPreguntaReset').style.display = 'block';
                    actualizarStepper(2);
                } else {
                    mostrarErrorModal(data.detail || 'No se pudo cargar la pregunta de seguridad.');
                }
            } catch {
                mostrarErrorModal('No se pudo conectar con el servidor.');
            }
        }

        // Match de contraseñas en modal
        function verificarMatchReset() {
            const p1   = document.getElementById('resetContrasena').value;
            const p2   = document.getElementById('resetConfirmar').value;
            const hint = document.getElementById('matchReset');
            if (!p2) { hint.style.display = 'none'; return; }
            const ok = p1 === p2;
            hint.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:11px;margin-top:6px;color:' + (ok ? 'var(--green)' : 'var(--red)');
            hint.innerHTML = ok
                ? '<i class="fas fa-check-circle"></i> Las contraseñas coinciden'
                : '<i class="fas fa-times-circle"></i> Las contraseñas no coinciden';
        }

        // PASO 2: validar el código y actualizar la contraseña
        async function resetearContrasena() {
            const correo    = document.getElementById('resetCorreo').value.trim();
            const codigo    = document.getElementById('resetCodigo').value.trim();
            const nueva     = document.getElementById('resetContrasena').value;
            const confirmar = document.getElementById('resetConfirmar').value;
            document.getElementById('alertaResetError').classList.remove('visible');

            if (!codigo || !nueva || !confirmar) { mostrarErrorModal('Completa todos los campos.'); return; }
            if (!/^\d{6}$/.test(codigo)) { mostrarErrorModal('El código debe tener 6 dígitos.'); return; }
            if (nueva.length < 6)     { mostrarErrorModal('La contraseña debe tener mínimo 6 caracteres.'); return; }
            if (nueva !== confirmar)   { mostrarErrorModal('Las contraseñas no coinciden.'); return; }

            try {
                const res  = await fetch('/api/auth/restablecer-contrasena', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, codigo, nueva_contrasena: nueva })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarExitoModal('✅ Contraseña cambiada. Ya puedes iniciar sesión.');
                    setTimeout(() => cerrarModal(), 3000);
                } else {
                    mostrarErrorModal(data.detail || data.mensaje || 'Error al cambiar la contraseña.');
                }
            } catch {
                mostrarErrorModal('No se pudo conectar con el servidor.');
            }
        }

        function verificarMatchPregunta() {
            const nueva = document.getElementById('resetContrasenaPregunta').value;
            const confirmar = document.getElementById('resetConfirmarPregunta').value;
            const hint = document.getElementById('matchPregunta');
            if (!confirmar) { hint.style.display = 'none'; return; }
            const coincide = nueva === confirmar;
            hint.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:11px;margin-top:6px;color:' + (coincide ? 'var(--green)' : 'var(--red)');
            hint.textContent = coincide ? 'Las contraseñas coinciden' : 'Las contraseñas no coinciden';
        }

        async function resetearConPregunta() {
            const correo = document.getElementById('resetCorreo').value.trim();
            const respuesta_seguridad = document.getElementById('resetRespuestaSeguridad').value.trim();
            const nueva_contrasena = document.getElementById('resetContrasenaPregunta').value;
            const confirmar = document.getElementById('resetConfirmarPregunta').value;
            document.getElementById('alertaResetError').classList.remove('visible');

            if (!respuesta_seguridad || !nueva_contrasena || !confirmar) { mostrarErrorModal('Completa todos los campos.'); return; }
            if (nueva_contrasena.length < 6) { mostrarErrorModal('La contraseña debe tener mínimo 6 caracteres.'); return; }
            if (nueva_contrasena !== confirmar) { mostrarErrorModal('Las contraseñas no coinciden.'); return; }

            try {
                const res = await fetch('/api/auth/restablecer-con-pregunta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, respuesta_seguridad, nueva_contrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarExitoModal('✅ Contraseña cambiada. Ya puedes iniciar sesión.');
                    setTimeout(() => cerrarModal(), 3000);
                } else {
                    mostrarErrorModal(data.detail || data.mensaje || 'No se pudo cambiar la contraseña.');
                }
            } catch {
                mostrarErrorModal('No se pudo conectar con el servidor.');
            }
        }

        async function manejarGoogle(googleResponse) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: googleResponse.credential })
                });
                const data = await res.json();
                if (!res.ok) { mostrarError(data.detail || 'No se pudo iniciar sesión con Google.'); return; }
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                if (data.aviso_seguridad) {
                    mostrarError(data.aviso_seguridad);
                    setTimeout(() => {
                        window.top.location.href = data.usuario.onboarding_completado ? 'dashboard.html' : 'onboarding.html';
                    }, 3500);
                } else {
                    window.top.location.href = data.usuario.onboarding_completado ? 'dashboard.html' : 'onboarding.html';
                }
            } catch {
                mostrarError('No se pudo conectar con el servidor.');
            }
        }

        async function cargarGoogle() {
            const estado = document.getElementById('googleStatus');
            try {
                const response = await fetch('/api/auth/google-config');
                const { client_id } = await response.json();
                if (!client_id) { estado.textContent = 'Inicio con Google disponible cuando se configure el servidor.'; return; }
                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.onload = () => {
                    google.accounts.id.initialize({ client_id, callback: manejarGoogle });
                    google.accounts.id.renderButton(document.getElementById('googleButton'), {
                        theme: 'outline', size: 'large', text: 'continue_with',
                        shape: 'rectangular', width: document.getElementById('googleButton').clientWidth
                    });
                };
                script.onerror = () => { estado.textContent = 'No se pudo cargar el inicio con Google.'; };
                document.head.appendChild(script);
            } catch {
                estado.textContent = 'No se pudo conectar con el servidor para cargar Google.';
            }
        }
        cargarGoogle();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
