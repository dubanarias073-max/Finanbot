<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0B22">
    <title>FinanBot - Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
               font-family: 'Segoe UI', sans-serif; color: #fff; padding: 24px;
               background: radial-gradient(ellipse at 30% 0%, #35356B 0%, #11112B 45%, #0B0B22 100%); }
        img { width: 96px; height: 96px; }
        h1 { margin: 16px 0 8px; font-size: 1.6rem; }
        p { color: #9ca3af; max-width: 360px; margin: 0 auto 20px; line-height: 1.5; }
        button { border: 0; border-radius: 12px; padding: 12px 22px; background: #5EEAD4; color: #0B0B22; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="FinanBot">
        <h1>Sin conexión</h1>
        <p>FinanBot necesita internet para consultar tus finanzas y hablar con el asistente. Revisa tu conexión e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
